name: Notify Discord on Release

on:
  release:
    types: [published, edited, prereleased, released]
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send release info to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_ACTION: ${{ github.event.action }}
          REPO_NAME: ${{ github.repository }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Truncate body to avoid Discord's 4096 char embed description limit
          BODY=$(echo "$RELEASE_BODY" | head -c 3800)
          if [ ${#RELEASE_BODY} -gt 3800 ]; then
            BODY="${BODY}...\n\n[Read more](${RELEASE_URL})"
          fi

          # Determine color based on prerelease status
          if [ "$IS_PRERELEASE" = "true" ]; then
            COLOR=15105570
          else
            COLOR=3066993
          fi

          # Determine title prefix based on action
          case "$RELEASE_ACTION" in
            published) TITLE_PREFIX="🚀 New Release" ;;
            edited) TITLE_PREFIX="✏️ Release Updated" ;;
            prereleased) TITLE_PREFIX="🧪 New Pre-release" ;;
            *) TITLE_PREFIX="📦 Release" ;;
          esac

          # Use jq to properly escape all JSON values
          JSON_PAYLOAD=$(jq -n \
            --arg title "${TITLE_PREFIX}: ${RELEASE_NAME:-$RELEASE_TAG}" \
            --arg url "$RELEASE_URL" \
            --arg description "$BODY" \
            --arg color "$COLOR" \
            --arg tag "$RELEASE_TAG" \
            --arg author "$RELEASE_AUTHOR" \
            --arg repo "$REPO_NAME" \
            '{embeds: [{title: $title, url: $url, description: $description, color: ($color | tonumber), fields: [{name: "Tag", value: $tag, inline: true}, {name: "Author", value: $author, inline: true}, {name: "Repository", value: $repo, inline: true}]}]}')

          curl -sf -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "$DISCORD_WEBHOOK"