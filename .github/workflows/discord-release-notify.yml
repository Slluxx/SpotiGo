name: Notify Discord on Release

on:
  release:
    types: [published, edited, prereleased, released]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send release info to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_ACTION: ${{ github.event.action }}
          REPO_NAME: ${{ github.repository }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Truncate body to avoid Discord's 4096 char embed description limit
          BODY=$(printf '%s' "$RELEASE_BODY" | head -c 3800)
          if [ "${#RELEASE_BODY}" -gt 3800 ]; then
            BODY="${BODY}...

[Read more](${RELEASE_URL})"
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            COLOR=15105570
          else
            COLOR=3066993
          fi

          case "$RELEASE_ACTION" in
            published) TITLE_PREFIX="🚀 New Release" ;;
            edited) TITLE_PREFIX="✏️ Release Updated" ;;
            prereleased) TITLE_PREFIX="🧪 New Pre-release" ;;
            *) TITLE_PREFIX="📦 Release" ;;
          esac

          NAME="${RELEASE_NAME:-$RELEASE_TAG}"

          # Build JSON with jq so multi-line bodies, quotes, and special
          # characters are always escaped correctly (no manual sed/awk escaping).
          JSON_PAYLOAD=$(jq -n \
            --arg title "${TITLE_PREFIX}: ${NAME}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$BODY" \
            --argjson color "$COLOR" \
            --arg tag "$RELEASE_TAG" \
            --arg author "$RELEASE_AUTHOR" \
            --arg repo "$REPO_NAME" \
            '{
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $desc,
                  color: $color,
                  fields: [
                    { name: "Tag", value: $tag, inline: true },
                    { name: "Author", value: $author, inline: true },
                    { name: "Repository", value: $repo, inline: true }
                  ]
                }
              ]
            }')

          echo "----- Payload being sent -----"
          echo "$JSON_PAYLOAD"
          echo "-------------------------------"

          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
               -H "Content-Type: application/json" \
               -d "$JSON_PAYLOAD" \
               "$DISCORD_WEBHOOK")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '/HTTP_STATUS:/d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Discord response: $HTTP_BODY"
          echo "Discord status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi